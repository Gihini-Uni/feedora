<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access form — Feedora</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>

<div class="respondent-home">
  <nav class="rh-nav">
    <a href="/" class="rh-logo">Feedora</a>

    <div class="profile-menu" id="profileMenu">
      <button class="profile-trigger" id="profileTrigger" aria-haspopup="true" aria-expanded="false">
        <img class="profile-avatar" src="{% static 'images/profile_pic.png' %}" alt="Profile">
        <svg class="profile-caret" width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div class="profile-dropdown" id="profileDropdown" role="menu">
        <a href="{% url 'respondent_profile' %}" class="profile-item" role="menuitem">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
          </svg>
          My Profile
        </a>
        <a href="{% url 'logout' %}" class="profile-item" role="menuitem">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Logout
        </a>
      </div>
    </div>
  </nav>

  <main class="rh-body">
    <h1 class="rh-title">Hi there!</h1>
    <h2 class="rh-welcome">Welcome to Feedora</h2>
    <p class="rh-sub">Enter code or link to access form</p>

    <form class="rh-form" method="post" action="{% url 'access_survey' %}">
      {% csrf_token %}
      <input type="text" name="code" class="rh-input" placeholder="Enter link or code" required>
      <button type="submit" class="rh-enter">Enter</button>
    </form>

    {% if error %}<p class="rh-error">{{ error }}</p>{% endif %}

    <p class="rh-footer">Create your own surveys at <strong>Feedora</strong></p>
  </main>
</div>

<script>
  const menu = document.getElementById('profileMenu');
  const trigger = document.getElementById('profileTrigger');
  trigger.addEventListener('click', e => { e.stopPropagation();
    const open = menu.classList.toggle('open'); trigger.setAttribute('aria-expanded', open); });
  document.addEventListener('click', e => { if (!menu.contains(e.target)) menu.classList.remove('open'); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') menu.classList.remove('open'); });
</script>
</body>
</html>
