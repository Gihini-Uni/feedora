<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Already responded — {{ survey.title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
{% load static %}
<style>
:root{
  --ink:#14140f;--ink-2:#6b6b62;--line:#e8e8e0;--surface:#fff;
  --serif:'Instrument Serif',Georgia,serif;--sans:'Inter',system-ui,sans-serif;
  --accent:{{ survey.theme_accent|default:'#14140f' }};
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);font-size:14px;color:var(--ink);
     background:{{ survey.theme_bg|default:'#fafaf7' }};
     min-height:100vh;display:flex;flex-direction:column;
     align-items:center;justify-content:center;
     -webkit-font-smoothing:antialiased;padding:20px;}
.topbar{position:fixed;top:0;left:0;right:0;height:48px;background:var(--surface);
        border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;}
.brand{font-family:var(--serif);font-size:18px;color:var(--ink);text-decoration:none;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
      border-top:6px solid var(--accent);padding:40px 40px 36px;
      max-width:460px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.06);}
.icon{width:56px;height:56px;border-radius:50%;background:#fef3c7;display:flex;
      align-items:center;justify-content:center;margin:0 auto 20px;}
.title{font-family:var(--serif);font-size:26px;font-weight:400;margin-bottom:10px;}
.desc{font-size:14px;color:var(--ink-2);line-height:1.6;margin-bottom:24px;}
.done-btn{display:inline-block;padding:11px 28px;background:var(--ink);color:#fff;
          text-decoration:none;border-radius:8px;font-size:14px;font-weight:500;transition:opacity .15s;}
.done-btn:hover{opacity:0.85;}
</style>
</head>
<body>
<div class="topbar"><a href="/" class="brand">Feedora</a></div>
<div class="card">
  <div class="icon">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
         stroke="#d97706" stroke-width="2.5" stroke-linecap="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
  </div>
  <h1 class="title">You've already responded</h1>
  <p class="desc">
    You've already submitted a response to <strong>{{ survey.title }}</strong>.
    This survey allows only one response per person.
  </p>
  <a href="/surveys/access/" class="done-btn">Done</a>
</div>
</body>
</html>
